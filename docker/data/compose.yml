services:
  cerve-postgres:
    image: postgres:17-alpine
    container_name: cerve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cerve}
      POSTGRES_USER: ${POSTGRES_USER:-cerve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerve}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - cerve-network
    volumes:
      - cerve-postgres-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
