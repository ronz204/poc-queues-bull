# ==========================================
# ====== Persistence Strategy (Disabled)
# ==========================================
# Cache-aside snapshots are disposable: a miss just triggers a recompute,
# so nothing here needs to survive a restart.
save ""
appendonly no

# ==========================================
# ====== Memory Management (Eviction)
# ==========================================
maxmemory 600mb
maxmemory-policy allkeys-lru

# ==========================================
# ====== Background Memory Deallocation (Lazy Freeing)
# ==========================================
lazyfree-lazy-expire yes
lazyfree-lazy-eviction yes
lazyfree-lazy-server-del yes

# ==========================================
# ====== Security & Accidental Command Guards
# ==========================================
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
