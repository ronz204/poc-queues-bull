services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.${ENV:-local}
    ports:
      - "5432:5432"
    networks:
      - bullky-network
    volumes:
      - bullky-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
